 font_family      family="JetBrains Mono"
 # font_family      family="Ubuntu Mono"
 # font_family      family="Adwaita Mono"
 # font_family      family="Liberation Mono"
 # font_family      monospace
 bold_font        auto
 italic_font      auto
 bold_italic_font auto
 font_size 11
cursor_shape block 
 #cursor_blink_interval -1
enable_audio_bell no
tab_title_template "{index}: {title} — {tab.active_wd}"
background #111222
background_opacity 0.89
include current-theme.conf
term xterm-256color
